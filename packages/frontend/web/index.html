<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoAgentHub - AI 智能平台</title>
    <script>
      // Theme bootstrap before first paint (ticket 21): a persisted choice in
      // coagenthub.theme wins, otherwise follow the OS preference — the page never
      // flashes the wrong theme.
      (() => {
        var theme = null;
        var dark = false;
        try {
          theme = localStorage.getItem("coagenthub.theme");
          dark =
            theme === "dark" ||
            (theme !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {
          // localStorage unavailable — stay with the light default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
