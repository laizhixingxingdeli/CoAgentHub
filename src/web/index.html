<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>CoAgentHub</title>
<!--
  无构建：浏览器直接吃这几个文件（ADR-0001）。路径是 /tokens.css 这种一层扁平名，
  因为静态服务只认那个形状（src/api/static.ts 的 SAFE_NAME），/src/web/... 会被拒。

  projects.js / task.js 不写成第二个 <script>：app.js 会 import 它们，再写一遍就
  执行两遍，路由与列表的监听各注册两次——"点一下项目跳两格"就是这么来的。
  modulepreload 只预取不执行，正好。
-->
<link rel="stylesheet" href="/tokens.css" />
<!-- narrate.js 也预取：它是三个页面共用的叙事层，projects.js 与 task.js 都要 import 它。
     同样**不能**写成会执行的 <script>：app.js 已经通过 import 链带到它了。 -->
<link rel="modulepreload" href="/narrate.js" />
<link rel="modulepreload" href="/projects.js" />
<link rel="modulepreload" href="/task.js" />
<link rel="modulepreload" href="/pool.js" />
<style>
/* 外壳布局与组件。色彩只从 tokens.css 进来，这里不出现新的色值——
   多一个"顺手调的色"就和观测面分叉一处，而分叉是没人会主动去对齐的。 */
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--background);
  color: var(--foreground);
  font: 14px/1.55 "Segoe UI", -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
}
.mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace; font-size: 12px; }
.muted { color: var(--muted-foreground); }

.shell { display: grid; grid-template-columns: 208px minmax(0, 1fr); min-height: 100vh; }

/* ===== 左侧固定导航 =====
 * 侧栏在明暗两个主题下都是深色的：它是导航面，不是内容面。所以不能接
 * --card（亮色主题下那是白的），也不能接 --foreground（同样会翻亮）。
 * 令牌值在 tokens.css（--sidebar / --sidebar-foreground / --sidebar-accent），
 * 这里只引用。正文区域一个 sidebar 令牌都不用——侧栏黑不等于整页黑。
 */
.nav {
  display: flex; flex-direction: column; gap: 3px;
  padding: 14px 10px; height: 100vh; position: sticky; top: 0;
  background: var(--sidebar); border-right: 1px solid var(--sidebar);
  color: var(--sidebar-foreground);
}
.brand { font-weight: 700; letter-spacing: .2px; padding: 2px 8px 12px; color: var(--sidebar-foreground); }
.nav .item {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; font-size: 13px; text-decoration: none;
  color: var(--sidebar-foreground); border-radius: calc(var(--radius) - 4px);
}
/* 图标跟文字走同一条颜色，不在这一层写死色：
   导航面已经给定了前景色，图标自己配一个色就会在主题切换时留在旧色上。 */
.nav .item .ico { width: 14px; height: 14px; flex: none; fill: currentColor; opacity: .9; }
.nav .item:hover { background: color-mix(in oklch, var(--sidebar-foreground) 12%, transparent); }
.nav .item[data-active="1"] {
  background: var(--sidebar-accent); color: var(--sidebar);
  font-weight: 600;
}
.nav .spacer { flex: 1; }
.nav .foot {
  display: grid; gap: 2px; padding-top: 9px;
  border-top: 1px solid color-mix(in oklch, var(--sidebar-foreground) 22%, transparent);
  font-size: 12px; color: color-mix(in oklch, var(--sidebar-foreground) 62%, transparent);
}

/* ===== 主区 ===== */
.main { display: flex; flex-direction: column; min-width: 0; }
.topbar {
  display: flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px;
  font-size: 13px; background: var(--card); border-bottom: 1px solid var(--border);
}
.topbar a { color: var(--muted-foreground); text-decoration: none; }
.topbar a:hover { color: var(--accent); }
.topbar .sep { color: var(--muted-foreground); }
.topbar .here { color: var(--foreground); }
.view { padding: 20px; }

/* ===== 项目页 ===== */
.page { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1000px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { height: auto; position: static; }
  .page { grid-template-columns: minmax(0, 1fr); }
  .task-cols { grid-template-columns: minmax(0, 1fr); }
  .evt-list { max-height: none; }
}
.pane-title {
  font-size: 11px; font-weight: 600; letter-spacing: .6px; text-transform: uppercase;
  color: var(--muted-foreground); margin: 0 0 8px;
}
.proj-list { list-style: none; margin: 0; padding: 0; }
.proj {
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--card); padding: 10px; margin-bottom: 8px; cursor: pointer;
}
.proj:hover { border-color: var(--accent); }
.proj[data-active="1"] { border-color: var(--accent); background: var(--accent-faint); }
.proj .name { font-weight: 600; font-size: 13px; word-break: break-all; }
.proj .meta { margin-top: 3px; font-size: 12px; color: var(--muted-foreground); }

.card {
  background: var(--card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
}
.card h2 { margin: 0 0 10px; font-size: 14px; word-break: break-all; }
.fields { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 6px 10px; font-size: 13px; margin: 0; }
.fields dt { color: var(--muted-foreground); }
.fields dd { margin: 0; word-break: break-all; }

.table-wrap { overflow-x: auto; }
table.tasks { width: 100%; border-collapse: collapse; font-size: 13px; }
.tasks th {
  text-align: left; white-space: nowrap; padding: 6px 8px;
  font-size: 11px; font-weight: 600; letter-spacing: .5px; text-transform: uppercase;
  color: var(--muted-foreground); border-bottom: 1px solid var(--border);
}
.tasks td { padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
.tasks tbody tr { cursor: pointer; }
.tasks tbody tr:hover td { background: var(--accent-faint); }
.tasks tbody tr:last-child td { border-bottom: 0; }
.cell-title { max-width: 340px; }
.cell-reason { color: var(--muted-foreground); max-width: 260px; }
.cell-usage { white-space: nowrap; font-size: 12px; color: var(--muted-foreground); }

/* 行左侧那条色条：颜色与阶段 chip 同源（都经 stageTone），否则「执行中」的
   chip 是绿的、它的行却是灰的，看起来像两件事。不写死色值，一律走 --status-*。 */
.tasks tbody tr { --row-tone: var(--border); }
.tasks tbody tr.row-queued { --row-tone: var(--status-queued); }
.tasks tbody tr.row-running { --row-tone: var(--status-running); }
.tasks tbody tr.row-done { --row-tone: var(--status-done); }
.tasks tbody tr.row-failed { --row-tone: var(--status-failed); }
.tasks tbody tr.row-cancelled { --row-tone: var(--status-cancelled); }
.tasks tbody tr.row-unconfirmed { --row-tone: var(--status-unconfirmed); }
.tasks tbody tr td:first-child { box-shadow: inset 3px 0 0 var(--row-tone); }

/* chip：底色/边色的公式与观测面 .badge 完全一致，只是类名不同。
   同一套 status-* 令牌喂两边，「执行中」在两个界面里才是同一个颜色。 */
.chip {
  display: inline-block; padding: 1px 8px; border-radius: 999px;
  font-size: 11px; font-weight: 600; white-space: nowrap;
  border: 1px solid transparent;
  color: var(--s, var(--status-queued));
  background: color-mix(in oklch, var(--s, var(--status-queued)) 14%, transparent);
  border-color: color-mix(in oklch, var(--s, var(--status-queued)) 35%, transparent);
}
.chip.queued { --s: var(--status-queued); }
.chip.running { --s: var(--status-running); }
.chip.done { --s: var(--status-done); }
.chip.failed { --s: var(--status-failed); }
.chip.cancelled { --s: var(--status-cancelled); }
.chip.unconfirmed { --s: var(--status-unconfirmed); }

.empty { color: var(--muted-foreground); text-align: center; padding: 36px 12px; }
/* ===== 任务详情页 =====
 * 布局写在 `<style>` 里而不是另起 task.css：静态服务只认一层扁平文件名，
 * 多一个文件就多一个要 modulepreload / 要在测试里枚举的名字（与 W1 同一取舍）。
 */
.task { display: grid; gap: 12px; }
.task-head {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center;
  column-gap: 16px; row-gap: 10px;
}
.task-title { margin: 0; font-size: 16px; word-break: break-all; grid-column: 1; }
.task-chips { display: flex; gap: 6px; flex-wrap: wrap; grid-column: 1; }
/* 「现在在干什么」：一屏黑话里最缺的一句，所以给它正文色而不是 muted。 */
.now-doing { grid-column: 1; color: var(--foreground); font-size: 13px; }
/* 修订号：名词带版本号（「契约 r2 · 规划 r1」），不是一堆光秃的数字。 */
.revision-line { grid-column: 1; font-size: 12px; color: var(--muted-foreground); }
.wait-reason { grid-column: 1; color: var(--status-unconfirmed); font-size: 13px; }
.task-stats {
  display: flex; gap: 22px; margin: 0; grid-column: 1;
  flex-wrap: wrap; align-items: end;
}
.task-stats .stat { display: grid; gap: 2px; }
.task-stats dt { font-size: 11px; color: var(--muted-foreground); }
.task-stats dd { margin: 0; font-weight: 600; }
.stop-btn { grid-column: 2; grid-row: 1 / span 2; align-self: center; }

/* disabled 要看得出 disabled：一个能点但点了没反应的按钮比没按钮更坑。 */
button {
  font: inherit; font-size: 13px; padding: 5px 12px; border-radius: calc(var(--radius) - 4px);
  border: 1px solid var(--border); background: var(--card); color: var(--foreground);
}
button[disabled] {
  color: var(--muted-foreground); background: var(--muted);
  border-style: dashed; cursor: not-allowed;
}

.task-cols { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 14px; align-items: start; }
.task-left, .task-right { min-width: 0; }
.evt-list { list-style: none; margin: 0; padding: 0; max-height: 60vh; overflow-y: auto; }
.evt {
  border: 1px solid var(--border); border-radius: var(--radius); background: var(--card);
  padding: 8px 10px; margin-bottom: 7px; cursor: pointer;
}
.evt:hover { border-color: var(--accent); }
.evt[data-active="1"] { border-color: var(--accent); background: var(--accent-faint); }
.evt-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
/* 角色流转徽章：一眼看出这一跳是谁交给谁。色只取 --accent 与 --muted-foreground。 */
.evt-badge {
  display: inline-block; padding: 1px 7px; border-radius: 999px; white-space: nowrap;
  font-size: 11px; font-weight: 600; color: var(--accent);
  background: var(--accent-faint); border: 1px solid var(--border);
}
.evt-action { font-weight: 600; font-size: 13px; word-break: break-word; }
.evt-time { margin-left: auto; font-size: 11px; color: var(--muted-foreground); white-space: nowrap; }
.evt-detail { margin-top: 4px; font-size: 12px; color: var(--muted-foreground); word-break: break-word; }
.evt-refs { margin-top: 3px; font-size: 11px; color: var(--muted-foreground); word-break: break-all; }

.detail-head { display: flex; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.detail-title { font-size: 14px; font-weight: 600; word-break: break-word; }

/* ===== 顶部独立用量卡 =====
 * 从页头那行统计里搬出来单独一块：按角色拆要看得清 L2/L1 各占多少。
 * 三层字级：总计大字 → 按角色（带环节色同源的小色点）→ 按类型。
 */
.usage-card { display: grid; gap: 8px; }
.usage-card-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.usage-num { font-size: 22px; font-weight: 700; }
.usage-unit { color: var(--muted-foreground); font-size: 12px; }
.usage-cost { color: var(--muted-foreground); font-size: 13px; }
.usage-roles { list-style: none; margin: 0; padding: 0; display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; }
.usage-roles li { display: flex; align-items: center; gap: 6px; }
/* 小色点与环节色、项目页 stageTone 同一套令牌，不新推一个色值。 */
.usage-roles li::before {
  content: ''; width: 8px; height: 8px; border-radius: 50%;
  background: var(--usage-tone, var(--status-queued));
}
.usage-roles .tone-queued { --usage-tone: var(--status-queued); }
.usage-roles .tone-running { --usage-tone: var(--status-running); }
.usage-roles .tone-unconfirmed { --usage-tone: var(--status-unconfirmed); }
.usage-pending { color: var(--muted-foreground); }
.usage-type { font-size: 12px; color: var(--muted-foreground); line-height: 1.5; }

/* ===== 左栏：按环节折叠的进度视图 =====
 * 环节色走 --status-*（queued / running / unconfirmed 三个），与 projects.js
 * stageTone 同源；不引用 --role-*：那一组令牌说的是「谁」，而环节色条
 * 说的是「干到哪一段」，与项目页那根条是同一件事。
 */
.stage-list { display: grid; gap: 7px; max-height: 60vh; overflow-y: auto; }
.stage {
  --stage-tone: var(--border);
  border: 1px solid var(--border); border-left: 3px solid var(--stage-tone);
  border-radius: var(--radius); background: var(--card); padding: 0 10px;
}
.stage.tone-queued { --stage-tone: var(--status-queued); }
.stage.tone-running { --stage-tone: var(--status-running); }
.stage.tone-unconfirmed { --stage-tone: var(--status-unconfirmed); }
.stage[data-active="1"] { border-color: var(--accent); border-left-color: var(--stage-tone); }
.stage-head {
  /* 一行自足：不展开也能看懂这一段是什么、跑了多久、花了多少、在干什么。 */
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  padding: 8px 2px; cursor: pointer; font-size: 13px;
}
.stage-head:hover .stage-name { color: var(--accent); }
.stage-name { font-weight: 600; word-break: break-word; }
.stage-dur { color: var(--muted-foreground); font-size: 11px; white-space: nowrap; }
.stage-usage { color: var(--muted-foreground); font-size: 11px; word-break: break-word; }
.stage-summary { font-size: 12px; word-break: break-word; }
/* 组内逐条事件仍走原来的三件套形状，只是缩进到环节里。 */
.stage .evt-list { padding: 2px 0 8px; max-height: none; overflow: visible; }

/* ===== 右上：这一跳传递的正文 ===== */
.detail-sub { font-size: 13px; margin-bottom: 6px; word-break: break-word; }
.detail-tech { font-size: 11px; color: var(--muted-foreground); word-break: break-all; margin-bottom: 10px; }
.detail-block { margin-top: 12px; border-top: 1px solid var(--border); padding-top: 10px; }
.detail-block-title { margin: 0 0 6px; font-size: 12px; color: var(--muted-foreground); }
.field-label { font-size: 11px; color: var(--muted-foreground); margin: 8px 0 2px; }
.detail-list { margin: 0 0 4px; padding-left: 18px; font-size: 13px; word-break: break-word; }
.detail-list li { margin-bottom: 3px; }
.order-card, .review-card {
  border: 1px solid var(--border); border-radius: calc(var(--radius) - 4px);
  padding: 8px 10px; margin-bottom: 8px;
}
.tech-id { font-size: 11px; color: var(--muted-foreground); margin-bottom: 4px; word-break: break-all; }
.ev-output { white-space: pre-wrap; word-break: break-word; margin-top: 3px; }

/* ===== 右下：常驻实时输出 ===== */
/* 裁剪说明横幅：在终端**上方**，不进正文行。它说的是「前面没了」，
   排在正文末尾会被读成「后面还有」，意思正好反过来。 */
.live-note {
  font-size: 12px; color: var(--status-unconfirmed);
  border: 1px solid var(--border); border-left: 3px solid var(--status-unconfirmed);
  border-radius: calc(var(--radius) - 4px); padding: 5px 8px; margin-bottom: 6px;
  word-break: break-word;
}

/* 终端块：明暗两个主题下都是深色——它模拟的是终端，不是页面。 */
pre.term {
  margin: 0; padding: 10px 12px; max-height: 340px; overflow-y: auto;
  background: var(--terminal-bg); color: var(--terminal-fg);
  border-radius: calc(var(--radius) - 4px);
  font-family: ui-monospace, "Cascadia Mono", Consolas, "Courier New", monospace;
  font-size: 12px; line-height: 1.5;
  white-space: pre-wrap; word-break: break-word;
}
pre.term .t { color: var(--terminal-dim); }
pre.term .tool { color: var(--accent); font-weight: 600; }
.live-bar { display: flex; gap: 14px; align-items: center; font-size: 12px; margin-bottom: 6px; }
.live-meta { display: flex; gap: 12px; align-items: center; }
.auto-scroll { display: flex; gap: 5px; align-items: center; cursor: pointer; color: var(--muted-foreground); }
.note { color: var(--muted-foreground); font-size: 13px; padding: 10px 2px; word-break: break-word; }
.file-list, .evidence, .escalations, .options { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.evidence li, .escalations li { margin-bottom: 10px; }
.ev-top { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.escalations .q { font-weight: 600; word-break: break-word; }
.escalations .why { color: var(--muted-foreground); margin-top: 4px; word-break: break-word; }
.escalations .a { margin-top: 4px; word-break: break-word; }

/* ===== 资源池页 =====
 * 表与卡直接复用 .card / table.tasks / .task-stats，这里只补表单那一行。
 * 不另起 pool.css：静态服务只认一层扁平文件名，多一个文件就多一个要
 * modulepreload、要在用例里枚举的名字（与任务页同一取舍）。
 */
.pool-form { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: end; }
.pool-form .field { display: grid; gap: 3px; }
.pool-form .field > span { font-size: 11px; color: var(--muted-foreground); }
.pool-form select, .pool-form input {
  font: inherit; font-size: 13px; padding: 5px 8px; border-radius: calc(var(--radius) - 4px);
  border: 1px solid var(--border); background: var(--card); color: var(--foreground);
}
/* 停用的下拉要看得出停用：能展开、选完却提交不了，比一开始就灰掉更坑。 */
.pool-form select[disabled], .pool-form input[disabled] {
  color: var(--muted-foreground); background: var(--muted); cursor: not-allowed;
}
.pool-error { color: var(--status-failed); }
/* 用量卡：与任务页同一个 .usage-breakdown 形状，只是不放在 .task-stats 里。 */
.usage-breakdown { font-size: 12px; line-height: 1.5; }

.placeholder {
  background: var(--card); border: 1px dashed var(--border);
  border-radius: var(--radius); padding: 28px; text-align: center;
  color: var(--muted-foreground);
}
</style>
</head>
<body>
<div class="shell">
  <nav class="nav" aria-label="主导航">
    <div class="brand">CoAgentHub</div>
    <!-- 图标是内联 SVG 且 fill=currentColor：不额外取网络资源，也不新攏一个色值。 -->
    <a class="item" href="#/projects" data-route="projects"><svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M1.6 3.2A1.2 1.2 0 0 1 2.8 2h3.1c.36 0 .7.16.93.43l.87 1.07h6.5A1.2 1.2 0 0 1 15.4 4.7v7.5a1.2 1.2 0 0 1-1.2 1.2H2.8a1.2 1.2 0 0 1-1.2-1.2V3.2Z"/></svg>项目</a>
    <a class="item" href="#/pool" data-route="pool"><svg class="ico" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true" focusable="false"><path d="M8 1.4 14.4 4.6 8 7.8 1.6 4.6 8 1.4Zm5.2 5.7 1.2.6L8 10.9 1.6 7.7l1.2-.6L8 9.6l5.2-2.5ZM8 12.1l5.2-2.5 1.2.6L8 13.4 1.6 10.2l1.2-.6L8 12.1Z"/></svg>资源池</a>
    <div class="spacer"></div>
    <div class="foot">
      <!-- 设置与用户名现在都是占位：设置页属于后续 Mission，
           这里点不出东西比点出一个假弹窗诚实。 -->
      <div>设置</div>
      <div>用户</div>
    </div>
  </nav>

  <div class="main">
    <div class="topbar" id="crumbs" aria-label="面包屑"></div>
    <div class="view" id="view"></div>
  </div>
</div>

<script type="module" src="/app.js"></script>
</body>
</html>
