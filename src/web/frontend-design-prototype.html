nt-size:12px;background:#edf2fa;color:#3e608d}.green{background:#e6f5ee;color:#20744c}.amber{background:#fff2d6;color:#96620a}.bar{height:6px;background:#edf1f6;border-radius:8px;overflow:hidden;margin:6px 0;width:110px}.bar i{display:block;height:100%;background:#5386e3}.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.notice{background:#eaf0fd;border:1px solid #cbdaf8;padding:10px 14px;border-radius:7px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;gap:12px}.lanes{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.lane{background:#e9edf3;border-radius:9px;padding:14px}.lane h3{font-size:14px;margin:0 0 14px}.lane .panel{margin-bottom:12px}.lane .panel h3{margin-bottom:5px}.timeline{padding-left:23px;border-left:2px solid #dde6f5;margin:20px 10px}.event{position:relative;padding:0 0 25px}.event:before{content:'';position:absolute;left:-30px;top:6px;border:4px solid #f4f7fc;width:8px;height:8px;background:#6993df;border-radius:50%}.event small{color:var(--muted)}.terminal{background:#152236;color:#c7d6e9;font:12px/1.8 Consolas,monospace;padding:18px;border-radius:6px;white-space:pre-wrap}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}.tabs .active{background:#e9f0ff;border-color:#a5bdec;color:var(--blue)}.switcher{position:fixed;bottom:18px;left:calc(50% + 70px);transform:translateX(-50%);background:#152236;color:white;border-radius:12px;padding:9px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 8px 30px #14223740;font-size:12px;z-index:5;white-space:nowrap}.switcher button{padding:5px 9px;background:#2c3e58;border:0;color:white}.switcher button.active{background:#edf3ff;color:#244c95}dialog{width:min(610px,94vw);border:0;border-radius:12px;padding:25px;color:var(--ink);box-shadow:0 20px 90px #0004}dialog::backdrop{background:#17263866}dialog h2{margin-top:0}label{display:block;margin:14px 0 5px}input,textarea,select{padding:8px;border:1px solid #ced7e3;border-radius:5px;background:white;color:inherit}input,textarea{width:100%}.foot{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.toast{position:fixed;top:18px;right:22px;background:#183a2c;color:white;border-radius:7px;padding:13px 20px;z-index:10}.state{font-size:11px;color:#8d9cb1;margin-top:30px}details{margin:15px 0}summary{cursor:pointer;color:#4b6486}@media(max-width:1100px){.split{grid-template-columns:minmax(0,1fr)}.stack{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stack>*+*{margin-top:0}}@media(max-width:820px){aside{position:static;width:auto;padding:12px 16px}aside h2{display:inline;margin-right:15px}aside small,.state{display:none}nav{display:flex;overflow:auto;margin:10px 0 0}nav button{width:auto;white-space:nowrap;margin:0;padding:7px}main{margin-left:0;padding:16px 16px 90px}.grid{grid-template-columns:repeat(2,1fr);gap:9px}.card{padding:12px}.metric{font-size:24px}.lanes,.stack{grid-template-columns:1fr}.switcher{left:50%;max-width:98vw}.top h1{font-size:21px}.task-live{order:-1}.notice{font-size:12px}}
</style><aside><h2>CoAgentHub</h2><small>PROJECT CONTROL ROOM</small><nav id="nav"></nav><div class="state" id="state"></div></aside><main id="app"></main><div class="switcher"><button data-cycle="-1" aria-label="上一方案">←</button><span>首页方案</span><button data-variant="A">A 项目矩阵</button><button data-variant="B">B 执行泳道</button><button data-variant="C">C 运行时间线</button><button data-cycle="1" aria-label="下一方案">→</button></div><dialog id="dialog"></dialog><script>
const s={page:'home',variant:new URLSearchParams(location.search).get('variant')||'A',role:'coordinator',ack:false,enabled:true,conflict:false};if(!['A','B','C'].includes(s.variant))s.variant='A';
const names={home:'项目总览',project:'项目与队列',todos:'检视待办',models:'角色与模型',docs:'文档审查',platform:'平台状态'};const roles={classifier:'分类器',coordinator:'协调者',executor:'执行者',independent_reviewer:'独立检视者'};const tag=(x,c='')=>`<span class="tag ${c}">${x}</span>`;const btn=(name,page)=>`<button data-page="${page}">${name}</button>`;const bar=n=>`<div class="bar"><i style="width:${n}%"></i></div>`;
const cost=()=>`<div class="panel"><h3>累计已报告费用 · 样例</h3><div class="metric">$2.29</div><p class="muted">缺失费用不计作零；不展示未提供的每日趋势。</p><div class="row"><span>CoAgentHub</span><b>$1.82</b></div><div class="row"><span>coagent-pi</span><b>$0.47</b></div><p class="muted">QueryRun 费用单列，聚合口径待确认。</p></div>`;
const run=()=>`<div class="panel"><h3>当前运行</h3>${tag('执行中','green')}<p><b>CoAgentHub / UI-DEMO-01</b><br><span class="muted">接线验收 · 尝试 2</span></p><div class="row"><span>协调者</span><span>demo-coordinator</span></div><div class="row"><span>最后活动</span><span>12 秒前 · 样例</span></div>${btn('查看任务 →','task')}</div>`;
const recent=()=>`<div class="panel" style="margin-top:16px"><h3>最近完成</h3><div class="row"><span>${tag('已完成','green')} UI-DEMO-00 · 项目队列接口</span><span class="muted">样例 · 集成证据齐全</span></div></div>`;
function home(){const metrics=`<div class="grid"><div class="card"><small>运行中的任务</small><div class="metric">1</div><span>1 个项目正在推进</span></div><div class="card"><small>需检视者处理</small><div class="metric">${s.ack?2:3}</div><span>2 项阻塞 · 通知可标记已读</span></div><div class="card"><small>队列完成数量</small><div class="metric">10 <span>/ 15</span></div><span>按任务计数，非验收覆盖率</span></div><div class="card"><small>累计已报告费用</small><div class="metric">$2.29</div><span>样例 · 不含缺失账目</span></div></div>`;const notice=`<div class="notice"><span>2 项阻塞需要处理：检查点批准、交卷审查。运行任务仍可继续推进。</span>${btn('进入待办 →','todos')}</div>`;
let body='';if(s.variant==='A')body=`<div class="split"><div class="panel"><h3>项目进度</h3><div class="scroll"><table><thead><tr><th>项目</th><th>队列完成</th><th>运行状态</th><th>待处理</th><th>已报告费用</th><th></th></tr></thead><tbody><tr><td><b>CoAgentHub</b><small>集成：codex/demo-integration</small></td><td>6 / 10${bar(60)}</td><td>${tag('1 个执行中','green')}<small>接线验收</small></td><td>2 项阻塞</td><td>$1.82</td><td>${btn('查看','project')}</td></tr><tr><td><b>coagent-pi</b><small>提示词与适配器</small></td><td>4 / 5${bar(80)}</td><td>${tag('等待检视','amber')}</td><td>1 项通知</td><td>$0.47</td><td>${btn('查看待办','todos')}</td></tr></tbody></table></div><p class="muted">进度来自队列终态；已验收、已合入与正在执行分别展示。</p></div><div class="stack">${cost()}${run()}</div></div>${recent()}`;
if(s.variant==='B')body=`<div class="lanes"><div class="lane"><h3>正在运行 · 1</h3>${run()}</div><div class="lane"><h3>等待检视 · 2</h3><div class="panel"><h3>CoAgentHub</h3>${tag('检查点待批准','amber')}<p>UI-DEMO-02<br><span class="muted">已有答复，需要显式批准</span></p>${btn('处理','todos')}</div><div class="panel"><h3>coagent-pi</h3>${tag('交卷待审','amber')}<p>UI-DEMO-03 · 证据已提交</p>${btn('审查','todos')}</div></div><div class="lane"><h3>排队与依赖 · 2</h3><div class="panel"><h3>CoAgentHub</h3><p>UI-DEMO-04 · 等待 UI-DEMO-01</p><p class="muted">依赖未完成，暂不可执行。</p>${btn('查看队列','project')}</div>${cost()}</div></div>${recent()}`;
if(s.variant==='C')body=`<div class="split"><div class="panel"><h3>运行脉络 · CoAgentHub</h3>${tag('接线验收进行中','green')}<div class="timeline"><div class="event"><small>现在 · 样例时间</small><h3>UI-DEMO-01 正在执行针对性验证</h3><p>尝试 2 · demo-executor · 尚未交卷</p>${btn('查看实时输出','task')}</div><div class="event"><small>上一条活动</small><h3>UI-DEMO-02 等待检查点批准</h3><p class="muted">已答复不等于已批准，仍保留费用门禁。</p>${btn('查看检查点','todos')}</div><div class="event"><small>最近完成</small><h3>UI-DEMO-00 已合入集成分支</h3><p class="muted">协调者结论、验证报告与合入记录齐全。</p></div></div></div><div class="stack">${cost()}<div class="panel"><h3>另一个项目</h3><b>coagent-pi</b><p>4 / 5 完成 · 等待检视</p>${btn('打开待办','todos')}</div></div></div>`;return metrics+notice+body;}
function project(){return `<div class="notice"><span>CoAgentHub · 集成分支 codex/demo-integration · 配置 revision 7</span><button data-modal="config">项目配置</button></div><div class="panel"><h3>有序 Mission 队列</h3><div class="scroll"><table><tr><th>顺序</th><th>任务</th><th>状态</th><th>依赖与可执行性</th><th></th></tr><tr><td>01</td><td>UI-DEMO-00 · 队列接口</td><td>${tag('已完成','green')}</td><td>合入证据齐全</td><td></td></tr><tr><td>02</td><td>UI-DEMO-01 · 接线验收</td><td>${tag('执行中','green')}</td><td>依赖已满足</td><td>${btn('查看','task')}</td></tr><tr><td>03</td><td>UI-DEMO-04 · 文档同步</td><td>${tag('排队')}</td><td>等待 UI-DEMO-01 完成</td><td></td></tr></table></div><p class="muted">当前接口不支持重排既有队列；新批次可在入队前预览顺序。</p><button data-modal="queue">预览冻结票入队</button> <button data-modal="brief">master 合入简报</button></div>${recent()}`;}
function task(){return `<p class="sub">UI-DEMO-01 · 接线验收进行中 · 样例费用 $0.32 · 尝试 2</p><div class="split"><div class="panel"><h3>任务过程</h3><div class="row"><span>Contract 冻结</span>${tag('已完成','green')}</div><div class="row"><span>执行者实现</span>${tag('已完成','green')}</div><div class="row"><span>接线验证</span>${tag('进行中')}</div><div class="row"><span>L2 / L3 验收</span>${tag('未开始')}</div><details><summary>展开完整 Contract（演示摘要）</summary><p>真实页面必须展示完整规格与逐条验收，不截短正文。样例不提供真实 Contract。</p></details><button data-modal="evidence">验证与变更证据</button></div><div class="panel task-live"><h3>实时输出 <span class="muted">· 演示，无订阅</span></h3><div class="terminal">[demo] attempt 2 / 接线验证<br>[demo] 已读取接口 fixture<br>[demo] 针对性验证正在运行<br>[demo] 尚无最终验证报告</div><p class="muted">桌面并列展示，小屏优先展示实时输出；历史输出按尝试分组。</p></div></div>`;}
function todos(){return `<div class="notice"><span>当前为观察模式。真实写操作需要有效检视身份及项目职责租约。</span>${tag('未绑定')}</div><div class="panel"><h3>阻塞事项 · 2</h3><div class="row"><span><b>检查点待批准</b><br><span class="muted">CoAgentHub / UI-DEMO-02 · 已答复，未批准</span></span><button data-modal="checkpoint">查看并批准</button></div><div class="row"><span><b>交卷审查</b><br><span class="muted">coagent-pi / UI-DEMO-03 · 核对完整 Contract、L2 与验证</span></span><button data-modal="review">审查证据</button></div><h3 style="margin-top:24px">非阻塞通知</h3><div class="row"><span>模型候选短暂故障已恢复</span><button data-ack>${s.ack?'已读（演示）':'标记已读（演示）'}</button></div><p class="muted">已读只处理通知，不解决业务门禁。Delivery 的 ACK 仍由桥接器负责。</p></div>`;}
function models(){return `<div class="tabs">${Object.entries(roles).map(([id,n])=>`<button data-role="${id}" class="${s.role===id?'active':''}">${n}</button>`).join('')}</div><div class="panel"><h3>${roles[s.role]}候选列表 · 配置 revision 7</h3><p class="muted">独立检视者是模型池角色；L3 是真实检视会话，两者分别呈现。</p><div class="row"><span><b>1 · demo-${s.role}</b><br><span class="muted">profile ID 已知 · 当前健康 · 原顺序读取</span></span>${tag(s.enabled?'已启用':'已停用',s.enabled?'green':'amber')}<button data-enable>${s.enabled?'停用':'启用'}（草稿）</button></div><details><summary>高级执行配置与思考档位</summary><p>只展示候选事实中明确存在的配置；模型目录目前只有 provider / model / label，不能推断执行 profile ID 或可用思考档位。</p></details><p class="muted">修改影响下一次调度，正在运行的尝试继续使用已固定的候选。</p>${s.conflict?'<p class="notice">演示：保存发生 409，草稿保留；请读取新 revision 并比较后重试。</p>':''}<button class="primary" data-save>保存完整角色列表（演示）</button> <button data-conflict>模拟配置冲突</button></div>`;}
function docs(){return `<div class="panel"><h3>文档差异提议</h3><div class="row"><span><b>运行流程补充 · revision 2</b><br><span class="muted">CoAgentHub · baseHash 核对后独立审批</span></span><button data-modal="document">审查差异</button></div><p class="muted">批准后在空档排队提交，代码合入不等待文档；保留未改条款及完整正文。</p></div>`;}
function platform(){return `<div class="grid"><div class="card"><small>服务</small><div class="metric">演示</div><span>未读取真实服务健康</span></div><div class="card"><small>状态写入</small><div class="metric">单写者</div><span>设计约束，非实时检测</span></div><div class="card"><small>检视桥接</small><div class="metric">未测</div><span>握手不等于实际投递</span></div><div class="card"><small>配置修订</small><div class="metric">7</div><span>样例值</span></div></div><div class="panel"><h3>诊断入口</h3><p>运行记录、候选健康与失败原因在此汇总；敏感配置和凭据不在页面呈现。</p><button data-modal="diagnostic">查看诊断样例</button></div>`;}
function render(){document.querySelector('#nav').innerHTML=Object.entries(names).map(([p,n])=>`<button data-page="${p}" class="${s.page===p?'active':''}">${n}${p==='todos'?' · '+(s.ack?2:3):''}</button>`).join('');document.querySelector('#state').textContent=`演示状态：布局 ${s.variant} / ${s.page} / role ${s.role} / enabled ${s.enabled} / conflict ${s.conflict}`;document.querySelector('#app').innerHTML=`<div class="top"><h1>${s.page==='task'?'任务详情':names[s.page]}</h1>${tag('离线设计原型')}</div><p class="sub">先看项目进度、费用和运行状态，再进入具体任务。</p><div class="demo">所有项目、金额、任务与结果均为样例。无网络请求、不保存数据，不执行真实批准或合入。</div>`+({home,project,task,todos,models,docs,platform}[s.page]||home)();document.querySelectorAll('[data-variant]').forEach(b=>b.classList.toggle('active',b.dataset.variant===s.variant));}
const modalNames={config:'项目执行配置',queue:'冻结票入队预览',brief:'master 合入简报',evidence:'验证与变更证据',checkpoint:'显式检查点批准',review:'交卷审查',document:'文档差异审查',diagnostic:'诊断样例'};
function modal(type){let content={config:'配置变更只影响未来启动。样例项目路径与集成分支不写入真实平台。',queue:'预览：UI-DEMO-05 → UI-DEMO-06，第二项依赖第一项。既有队列不重排，提交必须带 expectedRevision。',brief:'只读简报：逐项列出集成提交、验证与风险。此处没有合入 master 的按钮。',evidence:'当前仅有 diff stat 改动行总数。逐文件新增/删除统计及 patch 接口尚缺，不呈现虚构 patch。',checkpoint:'批准恢复已有答复，reviewer 与 reason 必填，保持费用上限及自然语言费用门禁。',review:'核对完整 Contract、逐条验收、协调者结论、WorkItem 交付/L2 验收、平台验证与缺失证据。',document:'revision / baseHash 冲突时拒绝覆盖；批准、修改与撤回均保留完整提议。',diagnostic:'样例：候选临时失败后转下一候选。熔断重置另走明确理由，不能伪装为重试。'}[type];document.querySelector('#dialog').innerHTML=`<h2>${modalNames[type]}</h2><p>${content}</p>${['checkpoint','review','document'].includes(type)?'<label>检视者身份</label><input value="未绑定真实身份" disabled><label>操作理由（仅演示）</label><textarea placeholder="写明证据与判断，不使用自动生成的授权" rows="3"></textarea>':''}<div class="foot"><button data-close>关闭</button>${['brief','evidence','diagnostic'].includes(type)?'':'<button class="primary" data-submit>确认演示动作</button>'}</div>`;document.querySelector('#dialog').showModal();}
