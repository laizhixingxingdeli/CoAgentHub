</style><aside><h2>CoAgentHub</h2><small>项目运行工作台</small><nav id="nav"></nav></aside><main id="app"></main><script>const sampleSteps=[{"title":"调查与拆单","role":"协调者","id":"coord-1","status":"已完成","tokens":"12,400","input":"3,200","output":"1,200","cache":"8,000","cost":"$0.041","from":"检视者 → 协调者","to":"协调者 → 执行者","incoming":"任务目标：补齐队列接线；保留原有费用门禁。验收要求：依赖满足才可执行，配置冲突不得覆盖。","outgoing":"工单 W-DEMO-01：核实 queue 接口与 fixture，补齐页面接线。允许范围 src/web；执行针对性验证，并提交命令、退出码和输出。","log":"[10:02:01] 读取完整 Contract\n[10:02:19] 核对 queue 返回形状\n[10:03:10] 创建并派发 W-DEMO-01"},{"title":"实现与首次验证","role":"执行者","id":"W-DEMO-01.exec-1","status":"已完成","tokens":"31,600","input":"7,000","output":"2,600","cache":"22,000","cost":"$0.096","from":"协调者 → 执行者","to":"执行者 → 协调者","incoming":"工单 W-DEMO-01：队列接线与 fixture 验证；不改变领域门禁。","outgoing":"执行结果：已补列表接线。证据：针对性验证退出码 0；遗留：409 场景尚未覆盖，请验收。","log":"[10:04:10] 修改页面渲染\n[10:06:21] 执行针对性验证\n[10:07:02] 提交结果与证据"},{"title":"L2 验收与返工要求","role":"协调者","id":"coord-2","status":"已完成 · 打回","tokens":"9,800","input":"2,400","output":"1,400","cache":"6,000","cost":"$0.036","from":"执行者 → 协调者","to":"协调者 → 执行者","incoming":"执行者提交：列表已接线；针对性验证退出码 0；409 未覆盖。","outgoing":"验收结论：打回。缺失验收项：配置 revision 冲突时保留用户草稿。返工要求：补真实 409 fixture，不自动覆盖，并重新提交证据。","log":"[10:08:10] 逐条核对验收项\n[10:08:51] 发现 409 证据缺失\n[10:09:12] 记录 reject 与 requiredChanges"},{"title":"返工与接线验证","role":"执行者","id":"W-DEMO-01.exec-2","status":"执行中","tokens":"6,200*","input":"1,700*","output":"500*","cache":"4,000*","cost":"未最终上报","from":"协调者 → 执行者","to":"执行者 → 协调者","incoming":"返工要求：补真实 409 fixture，冲突后保留草稿；不自动重试覆盖新配置。","outgoing":"尚未交回。本环节正在验证 409 场景，不能提前显示完成或通过。","log":"[10:10:00] 开始尝试 2\n[10:10:22] 读取 revision 冲突 fixture\n[10:11:03] 验证草稿保留行为\n[10:11:12] 针对性验证正在运行 …"},{"title":"L2 再验收","role":"协调者","id":"尚未创建","status":"待开始","tokens":"未知","input":"未知","output":"未知","cache":"未知","cost":"未知","from":"执行者 → 协调者","to":"协调者 → 独立检视者 / L3","incoming":"等待执行者交回真实结果与证据。","outgoing":"尚无结论。","log":"尚未启动，没有输出。"},{"title":"最终检视与集成","role":"L3 / 平台","id":"尚未创建","status":"待开始","tokens":"不适用 / 未报告","input":"未知","output":"未知","cache":"未知","cost":"未知","from":"协调者 → L3","to":"L3 → 平台","incoming":"等待完整交卷。执行模式要求独立检视时，按真实记录展示该环节。","outgoing":"尚无签字或合入结果。","log":"尚未启动，没有输出。"}];
const roles = {classifier:'分类器',coordinator:'协调者',executor:'执行者',independent_reviewer:'独立检视者'};
const missions = [
 {id:'UI-DEMO-04',project:'CoAgentHub',title:'文档同步',status:'排队',at:'10:10:30',steps:[]},
 {id:'UI-DEMO-01',project:'CoAgentHub',title:'队列接线验收',status:'执行中',at:'10:02:01',steps:sampleSteps},
 {id:'UI-DEMO-00',project:'CoAgentHub',title:'队列接口',status:'已完成',at:'09:30:00',steps:[]},
 {id:'UI-PI-DEMO-02',project:'coagent-pi',title:'提示词调整',status:'待检视',at:'09:10:00',steps:[]},
 {id:'UI-PI-DEMO-01',project:'coagent-pi',title:'角色配置',status:'已完成',at:'08:40:00',steps:[]}
];
const timings=[['10:02:01','10:03:10','1 分 09 秒'],['10:04:10','10:07:02','2 分 52 秒'],['10:08:10','10:09:12','1 分 02 秒'],['10:10:00','进行中','1 分 12 秒 · 样例'],['未开始','未开始','—'],['未开始','未开始','—']];
const priorities=Object.fromEntries(Object.keys(roles).map(role=>[role,['候选甲','候选乙','候选丙']]));
const savedPriorities=JSON.parse(JSON.stringify(priorities));
let route={page:'home',project:'CoAgentHub',mission:'UI-DEMO-01',step:3,tab:'handoff',role:'coordinator',expanded:false};
let conflict=false;
const esc=value=>String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
const chip=(text)=>`<span class="tag ${text==='执行中'||text==='已完成'?'green':text==='待检视'?'amber':''}">${esc(text)}</span>`;
const button=(text,action,attrs='')=>`<button data-action="${action}" ${attrs}>${text}</button>`;
function readRoute(){
 const params=new URLSearchParams(location.hash.replace(/^#/,''));
 for(const key of Object.keys(route))if(params.has(key))route[key]=params.get(key);
 route.page=['home','project','task','models'].includes(route.page)?route.page:'home';
 route.project=['CoAgentHub','coagent-pi'].includes(route.project)?route.project:'CoAgentHub';
 route.role=roles[route.role]?route.role:'coordinator';
 route.step=Math.max(0,Math.min(5,Number(route.step)||0));
 route.expanded=route.expanded===true||route.expanded==='true';
 route.tab=['handoff','history','evidence'].includes(route.tab)?route.tab:'handoff';
 if(!missions.some(m=>m.id===route.mission&&m.project===route.project))route.mission=missions.find(m=>m.project===route.project).id;
}
function navigate(changes){route={...route,...changes};const hash=new URLSearchParams(route).toString();if(location.hash.slice(1)===hash)render();else location.hash=hash;}
function openMission(id){const mission=missions.find(m=>m.id===id);navigate({page:'task',project:mission.project,mission:id,step:3});}
function homePage(){return `<section class="home-platform-status"><strong>平台状态</strong><span>服务：未连接</span><span>运行：1 项 · 样例</span><span>模型异常：未知</span><span>检视桥接：未验证</span></section><div class="panel"><h3>正在运行</h3>${missions.filter(m=>m.status==='执行中').map(m=>`<div class="row"><span><b>${esc(m.project)} · ${esc(m.title)}</b><br><span class="muted">返工与接线验证 · 第 2 次尝试</span></span>${button('查看运行','mission',`data-id="${m.id}"`)}</div>`).join('')}</div>`;}
function projectPage(){return `<label>项目 <select id="project-switch">${['CoAgentHub','coagent-pi'].map(p=>`<option ${p===route.project?'selected':''}>${p}</option>`).join('')}</select></label><section class="panel" style="margin-top:16px"><h3>任务列表</h3><div class="scroll"><table><thead><tr><th>任务</th><th>状态</th><th>创建时间</th><th></th></tr></thead><tbody>${missions.filter(m=>m.project===route.project).sort((a,b)=>b.at.localeCompare(a.at)).map(m=>`<tr><td><b>${esc(m.title)}</b><small>${m.id}</small></td><td>${chip(m.status)}</td><td>${m.at}</td><td>${button('查看','mission',`data-id="${m.id}"`)}</td></tr>`).join('')}</tbody></table></div></section>`;}
function timeline(mission){
 const completed=mission.steps.map((step,index)=>({step,index})).filter(x=>x.index<3);
 const rows=route.expanded?mission.steps.map((step,index)=>({step,index})):mission.steps.map((step,index)=>({step,index})).filter(x=>x.index>=3||x.index===route.step);
 return `<section class="panel run-timeline"><div class="timeline-top"><h3>运行时间线 · 10 月 4 日</h3><span>${button(route.expanded?'收起已完成':'展开已完成（'+completed.length+'）','expand')} ${button('定位当前','current')}</span></div><div class="time-nodes">${rows.map(({step,index})=>`<button data-action="step" data-index="${index}" data-step="${index}" class="time-node ${index===3?'current':''} ${index>3?'pending':''} ${index===route.step?'chosen':''}"><small>${timings[index][0]}${index<3?' → '+timings[index][1]:''}</small><strong>${index+1}. ${esc(step.title.replace('L2','协调者'))}</strong><small>${esc(step.role)} · ${esc(step.status)}</small><small>${timings[index][2]}</small><small>${esc(step.tokens)} 词元</small></button>`).join('')}</div></section>`;
}
function detail(step){
 let body='';
 if(route.tab==='handoff')body=`<h3>收到 · ${esc(step.from)}</h3><div class="handoff-text">${esc(step.incoming)}</div><h3 style="margin-top:18px">交出 · ${esc(step.to)}</h3><div class="handoff-text">${esc(step.outgoing)}</div>`;
 if(route.tab==='history')body=`<div class="terminal">${esc(step.log)}</div>`;
 if(route.tab==='evidence')body='<p>此样例没有真实验证报告。</p><p>正式页面显示原始命令、退出码、输出与来源记录。</p>';
 return `<section class="panel"><h3>${esc(step.title.replace('L2','协调者'))}</h3><div class="token-grid">${[['输入',step.input],['输出',step.output],['缓存读取',step.cache],['总词元',step.tokens]].map(([label,value])=>`<div class="card"><small>${label}</small><b>${esc(value)}</b></div>`).join('')}</div><div class="row"><span>费用</span><b>${esc(step.cost)}</b></div>${route.step===3?'<p class="muted">* 已上报暂计值</p>':''}<div class="tabs" style="margin-top:14px">${[['handoff','交接沟通'],['history','本环节输出'],['evidence','证据']].map(([id,label])=>`<button data-action="tab" data-tab="${id}" class="${route.tab===id?'active':''}">${label}</button>`).join('')}</div>${body}</section>`;
}
function taskPage(){
 const mission=missions.find(m=>m.id===route.mission);
 if(!mission.steps.length)return `<div class="notice"><span>${esc(mission.project)} · ${esc(mission.title)} ${chip(mission.status)}</span>${button('返回任务列表','project')}</div><section class="panel"><h3>${mission.status==='排队'?'等待依赖完成':'暂无过程样例'}</h3><p>${mission.status==='排队'?'依赖任务：UI-DEMO-01':'此任务的时间线尚未制作。'}</p></section>`;
 return `<div class="notice"><span><b>${esc(mission.project)} · ${esc(mission.title)}</b> · 返工与接线验证</span>${button('返回任务列表','project')}</div>${timeline(mission)}<div class="mission-main"><section class="panel"><div class="live-head"><h3>当前实时输出</h3>${chip('执行中')}</div><div class="terminal">${esc(mission.steps[3].log)}</div></section>${detail(mission.steps[route.step])}</div>`;
}
function isDirty(role){return JSON.stringify(priorities[role])!==JSON.stringify(savedPriorities[role]);}
function modelsPage(){
 const role=route.role;
 return `<div class="tabs">${Object.entries(roles).map(([id,name])=>`<button data-action="role" data-role="${id}" class="${id===role?'active':''}">${name}${isDirty(id)?' · 未保存':''}</button>`).join('')}</div><section class="panel"><h3>${roles[role]} · 候选优先级</h3>${priorities[role].map((name,index)=>`<div class="row"><b>${index+1}. ${name}</b><span>${button('上移','move',`data-index="${index}" data-dir="-1" ${index===0?'disabled':''}`)} ${button('下移','move',`data-index="${index}" data-dir="1" ${index===2?'disabled':''}`)}</span></div>`).join('')}<div class="row"><span>${isDirty(role)?'有未保存修改':'顺序已保存 · 演示'}</span>${button('保存优先级','save',`class="primary" ${!isDirty(role)?'disabled':''}`)}</div>${conflict?'<div class="notice">配置版本冲突，草稿已保留。</div>':''}${button('模拟版本冲突','conflict')} ${conflict?button('完成比较后重试（演示）','resolve'):''}</section>`;
}
function render(){
 const titles={home:'首页',project:'项目任务列表',task:'任务运行详情',models:'角色与模型'};
 document.querySelector('#nav').innerHTML=['home','project','models'].map(page=>`<button data-action="${page}" class="${route.page===page||(page==='project'&&route.page==='task')?'active':''}">${titles[page]}</button>`).join('');
 document.querySelector('#app').innerHTML=`<div class="top"><h1>${titles[route.page]}</h1><span class="tag">设计演示 · 样例数据</span></div><div style="height:18px"></div>`+({home:homePage,project:projectPage,task:taskPage,models:modelsPage}[route.page])();
}
document.addEventListener('click',event=>{
 const target=event.target.closest('[data-action]');if(!target||target.disabled)return;
 const action=target.dataset.action;
 if(['home','project','models'].includes(action))navigate({page:action});
 if(action==='mission')openMission(target.dataset.id);
 if(action==='step')navigate({step:Number(target.dataset.index)});
 if(action==='tab')navigate({tab:target.dataset.tab});
 if(action==='role')navigate({role:target.dataset.role});
 if(action==='expand')navigate({expanded:!route.expanded});
 if(action==='current'){navigate({step:3});requestAnimationFrame(()=>document.querySelector('.time-node.current')?.scrollIntoView({block:'nearest',inline:'center'}));}
 if(action==='move'){const order=priorities[route.role],index=Number(target.dataset.index),next=index+Number(target.dataset.dir);if(next>=0&&next<order.length){[order[index],order[next]]=[order[next],order[index]];render();}}
 if(action==='save'&&!conflict){savedPriorities[route.role]=[...priorities[route.role]];render();}
 if(action==='conflict'){conflict=true;render();}
 if(action==='resolve'){conflict=false;render();}
});
document.addEventListener('change',event=>{if(event.target.id==='project-switch')navigate({project:event.target.value,mission:missions.find(m=>m.project===event.target.value).id,step:3});});
window.addEventListener('hashchange',()=>{readRoute();render();});
window.addEventListener('beforeunload',event=>{if(Object.keys(roles).some(isDirty)){event.preventDefault();event.returnValue='';}});
readRoute();render();
</script></html>
